# Example GitHub Actions snippet for hardening release artifacts with AxObfus
name: Harden Build with AxObfus
on:
  workflow_dispatch:

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npx -y axobfus@latest defend ./dist -o ./dist-shielded --manifest
