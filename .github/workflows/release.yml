name: Release axobfus

# Tag-only releases. This workflow builds and publishes a GitHub Release for
# axobfus only; it never publishes npm packages or targets the upstream BLA repo.
on:
  push:
    tags:
      - "axobfus-*"
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Expected release version (must match package.json / tag)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: release-axobfus
  cancel-in-progress: false

jobs:
  release:
    name: Build, Verify & Release axobfus
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify version, trigger tag, and target tag commit consistency
        id: check_release
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          TRIGGER_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          HEAD_SHA=$(git rev-parse HEAD)
          TAG="axobfus-${LOCAL_VERSION}"

          if [ -n "${DISPATCH_VERSION}" ]; then
            NORM_DISPATCH="${DISPATCH_VERSION#v}"
            NORM_DISPATCH="${NORM_DISPATCH#axobfus-}"
            if [ "${NORM_DISPATCH}" != "${LOCAL_VERSION}" ]; then
              echo "::error::workflow_dispatch version '${DISPATCH_VERSION}' does not match package.json version '${LOCAL_VERSION}'"
              exit 1
            fi
          fi

          if [[ "${TRIGGER_REF}" == refs/tags/* ]]; then
            RAW_TAG="${TRIGGER_REF#refs/tags/}"
            if [[ "${RAW_TAG}" == axobfus-* ]]; then
              TAG_VER="${RAW_TAG#axobfus-}"
            elif [[ "${RAW_TAG}" == v* ]]; then
              TAG_VER="${RAW_TAG#v}"
            else
              echo "::error::Unsupported release tag format '${RAW_TAG}'"
              exit 1
            fi
            if [ "${TAG_VER}" != "${LOCAL_VERSION}" ]; then
              echo "::error::Trigger tag '${RAW_TAG}' does not match package.json version '${LOCAL_VERSION}'"
              exit 1
            fi
          elif [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "::error::Release workflow only runs on version tags or workflow_dispatch"
            exit 1
          fi

          EXISTING_TAG_SHA=""
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" --force
            EXISTING_TAG_SHA=$(git rev-list -n 1 "${TAG}")
          elif git rev-parse "${TAG}" >/dev/null 2>&1; then
            EXISTING_TAG_SHA=$(git rev-list -n 1 "${TAG}")
          fi
          if [ -n "${EXISTING_TAG_SHA}" ] && [ "${EXISTING_TAG_SHA}" != "${HEAD_SHA}" ]; then
            echo "::error::Existing tag '${TAG}' points to ${EXISTING_TAG_SHA}, which differs from checkout commit ${HEAD_SHA}. Refusing cross-commit release."
            exit 1
          fi

          echo "local_version=${LOCAL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "existing_tag_sha=${EXISTING_TAG_SHA}" >> "$GITHUB_OUTPUT"

      - name: Run full verification gates (typecheck, build, test, benchmark)
        run: |
          npm run typecheck
          npm run build
          npm test
          npm run benchmark

      - name: Pack axobfus tarball and verify release consistency
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          TRIGGER_REF: ${{ github.ref }}
          HEAD_SHA: ${{ steps.check_release.outputs.head_sha }}
          EXISTING_TAG_SHA: ${{ steps.check_release.outputs.existing_tag_sha }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { AXOBFUS_IDENTITY } from "./dist/identity.js";
            import { packReleaseTarball, verifyReleaseConsistency } from "./dist/core/release-plan.js";
            const pkg = JSON.parse(readFileSync("./package.json", "utf8"));
            const packed = packReleaseTarball(process.cwd(), "./release-assets");
            const plan = verifyReleaseConsistency({
              packageVersion: pkg.version,
              identityVersion: AXOBFUS_IDENTITY.version,
              dispatchVersion: process.env.DISPATCH_VERSION || null,
              triggerRef: process.env.TRIGGER_REF || null,
              headSha: process.env.HEAD_SHA,
              existingTagSha: process.env.EXISTING_TAG_SHA || null,
              tarballSha256: packed.primary.sha256,
            });
            console.log("Release plan verified:", JSON.stringify(plan, null, 2));
          '
          cat release-assets/SHA256SUMS.txt

      - name: Create or verify GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check_release.outputs.tag }}
          VERSION: ${{ steps.check_release.outputs.local_version }}
          HEAD_SHA: ${{ steps.check_release.outputs.head_sha }}
        run: |
          set -euo pipefail
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG" "$HEAD_SHA"
            git push origin "$TAG"
          else
            TAG_SHA=$(git rev-list -n 1 "$TAG")
            if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
              echo "::error::Tag $TAG points to $TAG_SHA instead of $HEAD_SHA"
              exit 1
            fi
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release '$TAG' already exists for verified tag commit $HEAD_SHA."
          else
            gh release create "$TAG" release-assets/* \
              --verify-tag \
              --title "AxObfus v${VERSION}" \
              --generate-notes
          fi
